<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 960" width="1240" height="960" role="img" aria-label="AirMove Analyzer 소프트웨어 구성도 — 단일 프로세스 안의 UI·분석 엔진·저장 계층과, 선택적 HTTPS 아웃바운드로만 연결되는 4개 외부 서비스" font-family="'IBM Plex Sans KR', Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#1f2430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#3b4252"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#a60739"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="960" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="44" font-size="22" font-weight="600">AirMove Analyzer 소프트웨어 구성도</text>
  <text x="40" y="68" font-size="12" fill="#6b7280">공항감시레이더 종합분석체계 v0.1.0 · Windows 단독 실행형(Portable) · Tauri v2 (Rust 백엔드 + WebView2 UI) · 단일 프로세스</text>

  <!-- 범례 -->
  <line x1="880" y1="40" x2="918" y2="40" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="928" y="44">프로세스 내부 흐름</text>
  <line x1="880" y1="64" x2="918" y2="64" stroke="#a60739" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="928" y="68">HTTPS 아웃바운드 (사용자 개시)</text>
  <rect x="1090" y="32" width="14" height="14" fill="#fafbfc" stroke="#8a94a6" stroke-dasharray="3 2"/>
  <text x="1112" y="44">외부 영역 (선택 기능)</text>
  <rect x="1090" y="56" width="14" height="14" fill="#fdf6e7" stroke="#b7791f"/>
  <text x="1112" y="68">외부 공개 서비스</text>

  <!-- ===== 프로세스 경계 ===== -->
  <rect x="40" y="96" width="780" height="720" rx="8" fill="#ffffff" stroke="#a60739" stroke-width="2"/>
  <text x="60" y="122" font-size="14" font-weight="700" fill="#a60739">AirMove Analyzer.exe</text>
  <text x="228" y="122" fill="#6b7280">단일 프로세스 · 일반 사용자 권한 · 설치·레지스트리 변경 없음 · 수신(Listening) 포트 없음 · 자동 업데이트 없음</text>

  <!-- UI 계층 -->
  <rect x="60" y="140" width="740" height="210" rx="6" fill="#eef2f8"/>
  <text x="76" y="162" font-size="13" font-weight="700">UI 계층</text>
  <text x="136" y="162" fill="#6b7280">WebView2 (Edge Chromium 런타임, OS 제공) · React 19 · TypeScript 5.8 · Zustand 5 · react-router 7</text>

  <g stroke="#3b4252" fill="#ffffff">
    <rect x="80" y="178" width="160" height="30" rx="15"/>
    <rect x="260" y="178" width="160" height="30" rx="15"/>
    <rect x="440" y="178" width="160" height="30" rx="15"/>
    <rect x="620" y="178" width="160" height="30" rx="15"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="160" y="197">메인 창 (main)</text>
    <text x="340" y="197">항적지도 창 (trackmap)</text>
    <text x="520" y="197">도면 창 (drawing)</text>
    <text x="700" y="197">보고서 창 (report)</text>
  </g>
  <text x="80" y="232"><tspan fill="#6b7280">페이지</tspan>  자료등록 · ASTERIX 통계 · 항적지도 · 표적소실/LoS 장애물 · 이중표적 · 보고서 생성 · 레이더/항공기 관리 · 설정 · 사용방법</text>

  <rect x="80" y="250" width="340" height="84" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="92" y="270" font-size="12" font-weight="700">Web Worker ×2</text>
  <text x="92" y="290">비행 통합 · 뷰포트 포인트 쿼리 (청크 스트리밍)</text>
  <text x="92" y="307">GPU 커버리지 연산 — WebGPU 컴퓨트 셰이더, CPU 폴백</text>
  <text x="92" y="324" fill="#6b7280">1천만+ 포인트를 Worker가 소유, 메인 스레드 비축적</text>

  <rect x="440" y="250" width="340" height="84" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="452" y="270" font-size="12" font-weight="700">지도 렌더링 (GPU)</text>
  <text x="452" y="290">deck.gl 9.2 + MapLibre GL 5 + react-map-gl 8</text>
  <text x="452" y="307">3D Tiles(loaders.gl) · 지형 · 건물 · 항적 · 커버리지 레이어</text>
  <text x="452" y="324" fill="#6b7280">배경지도 타일: CARTO (선택, 외부)</text>

  <!-- IPC 띠 -->
  <line x1="110" y1="350" x2="110" y2="366" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="750" y1="350" x2="750" y2="366" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="60" y="366" width="740" height="30" rx="4" fill="#ffffff" stroke="#3b4252" stroke-dasharray="4 3"/>
  <text x="430" y="385" text-anchor="middle"><tspan font-weight="700">Tauri IPC</tspan> — invoke(프로세스 내부 호출) · bulk:// 인프로세스 커스텀 프로토콜(대용량 결과 파일 매개) · 원격 디버깅 포트 없음</text>
  <line x1="110" y1="396" x2="110" y2="412" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="750" y1="396" x2="750" y2="412" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- 분석 엔진 계층 -->
  <rect x="60" y="412" width="740" height="212" rx="6" fill="#fbf1f3"/>
  <text x="76" y="434" font-size="13" font-weight="700">분석 엔진 계층</text>
  <text x="176" y="434" fill="#6b7280">Rust · Tauri 2 · rayon(병렬) · tokio · rusqlite · reqwest(HTTPS 클라이언트) · webview2-com(PDF)</text>

  <g fill="#ffffff" stroke="#3b4252">
    <rect x="80" y="450" width="166" height="110" rx="4"/>
    <rect x="258" y="450" width="166" height="110" rx="4"/>
    <rect x="436" y="450" width="166" height="110" rx="4"/>
    <rect x="614" y="450" width="166" height="110" rx="4"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="92" y="470">parser</text>
    <text x="270" y="470">analysis</text>
    <text x="448" y="470">geo</text>
    <text x="626" y="470">export</text>
  </g>
  <g>
    <text x="92" y="490">NEC ASS 프레임 파서</text>
    <text x="92" y="507">ASTERIX CAT048 · 034 · 008</text>
    <text x="92" y="524">극좌표 → WGS84 변환</text>
    <text x="92" y="541">EPSG 5186 / 5179 좌표변환</text>

    <text x="270" y="490">표적소실 탐지 · 통계</text>
    <text x="270" y="507">LoS (4/3 유효지구 모델)</text>
    <text x="270" y="524">커버리지 · 파노라마</text>
    <text x="270" y="541">장애물 월간 · PSR · 이중표적</text>

    <text x="448" y="490">SRTM 지형 · 산봉우리</text>
    <text x="448" y="507">건물 대장 / 실측 3D / 수동</text>
    <text x="448" y="524">토지이용 · 중복억제</text>
    <text x="448" y="541">지자기편각 (WMM 오프라인)</text>

    <text x="626" y="490">PDF — WebView2 PrintToPdf</text>
    <text x="626" y="507">Excel — OOXML 직접 생성</text>
    <text x="626" y="524">DB 백업 — zip</text>
    <text x="626" y="541" fill="#6b7280">외부 변환 도구·서버 없음</text>
  </g>

  <rect x="80" y="578" width="340" height="28" rx="14" fill="#ffffff" stroke="#3b4252"/>
  <text x="250" y="596" text-anchor="middle">SQLite 접근 — rusqlite(내장) · r2d2 연결 풀 · 로컬 파일만</text>
  <rect x="614" y="578" width="166" height="28" rx="14" fill="#ffffff" stroke="#a60739"/>
  <text x="697" y="596" text-anchor="middle" fill="#a60739">HTTPS 클라이언트 (reqwest)</text>

  <!-- 엔진 → 저장 -->
  <line x1="250" y1="606" x2="250" y2="680" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="258" y="636">읽기 / 쓰기</text>
  <line x1="700" y1="624" x2="700" y2="680" stroke="#3b4252" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="708" y="636">대용량 결과 중계</text>

  <!-- 저장 계층 -->
  <rect x="60" y="640" width="740" height="160" rx="6" fill="#eff5ee"/>
  <text x="76" y="662" font-size="13" font-weight="700">저장 계층</text>
  <text x="150" y="662" fill="#6b7280">로컬 파일만 · 실행파일 옆 data/ 폴더 · 외부 DB 서버 없음</text>

  <rect x="80" y="680" width="340" height="100" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="92" y="700" font-size="12" font-weight="700">data/adsb.db — SQLite (23 테이블)</text>
  <text x="92" y="720">항적 포인트 · 레이더/항공기 정보 · 분석 결과 · 보고서</text>
  <text x="92" y="737">설정 (V-World 계정 정보 포함)</text>
  <text x="92" y="754" fill="#6b7280">포터블: data/ 폴더째 이동·복사 가능</text>

  <rect x="440" y="680" width="160" height="100" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="452" y="700" font-size="12" font-weight="700">data/tiles3d/</text>
  <text x="452" y="720">실측 3D 건물 타일</text>
  <text x="452" y="737">(3D Tiles)</text>
  <text x="452" y="754" fill="#6b7280">사용자 등록 시에만</text>

  <rect x="620" y="680" width="160" height="100" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="632" y="700" font-size="12" font-weight="700">임시 bulk 파일</text>
  <text x="632" y="720">OS 임시 폴더</text>
  <text x="632" y="737">대용량 IPC 중계용</text>
  <text x="632" y="754" fill="#6b7280">읽은 즉시 삭제</text>

  <!-- ===== 입력 / 출력 ===== -->
  <line x1="240" y1="850" x2="240" y2="816" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="838">읽기 — 파일 선택 대화상자 (fs:allow-read)</text>
  <rect x="40" y="850" width="400" height="56" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="56" y="870" font-size="12" font-weight="700">입력 — 사용자가 선택한 파일</text>
  <text x="56" y="890">ASS 레이더 저장자료 · SRTM HGT · SHP(산봉우리/토지이용) · 실측 3D · 3D Tiles</text>

  <line x1="640" y1="816" x2="640" y2="850" stroke="#3b4252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="650" y="838">저장 — 저장 대화상자로 경로 지정</text>
  <rect x="460" y="850" width="360" height="56" rx="4" fill="#ffffff" stroke="#3b4252"/>
  <text x="476" y="870" font-size="12" font-weight="700">출력 — 사용자 지정 경로</text>
  <text x="476" y="890">PDF 보고서 · Excel(xlsx) · DB 백업(zip)</text>

  <!-- ===== 외부 영역 ===== -->
  <rect x="860" y="96" width="350" height="720" rx="8" fill="#fafbfc" stroke="#8a94a6" stroke-dasharray="6 4"/>
  <text x="876" y="122" font-size="13" font-weight="700">외부 인터페이스 (인터넷)</text>
  <text x="876" y="140" fill="#6b7280">HTTPS 443 아웃바운드만 · 사용자 개시 · 선택 기능 · 수신 없음</text>
  <text x="876" y="156" fill="#6b7280">폐쇄망: 사전 다운로드 파일 등록으로 전 기능 오프라인 동작</text>

  <!-- CARTO -->
  <line x1="780" y1="292" x2="880" y2="292" stroke="#a60739" stroke-width="1.5" marker-end="url(#arrowAccent)"/>
  <text x="830" y="284" font-size="10" text-anchor="middle" fill="#a60739">타일 좌표</text>
  <rect x="880" y="250" width="310" height="84" rx="4" fill="#fdf6e7" stroke="#b7791f"/>
  <text x="892" y="270" font-size="12" font-weight="700">CARTO 배경지도</text>
  <text x="892" y="290">basemaps.cartocdn.com</text>
  <text x="892" y="307">지도 배경 타일 / 스타일 (LoS 장애물·이중표적·OM 도면)</text>
  <text x="892" y="324" fill="#6b7280">미접속 시 배경지도만 미표시</text>

  <!-- reqwest 팬아웃 -->
  <path d="M780,592 H840" stroke="#a60739" stroke-width="1.5" fill="none"/>
  <path d="M840,592 V490 H880" stroke="#a60739" stroke-width="1.5" fill="none" marker-end="url(#arrowAccent)"/>
  <path d="M840,592 H880" stroke="#a60739" stroke-width="1.5" fill="none" marker-end="url(#arrowAccent)"/>
  <path d="M840,592 V677 H880" stroke="#a60739" stroke-width="1.5" fill="none" marker-end="url(#arrowAccent)"/>

  <!-- V-World -->
  <rect x="880" y="440" width="310" height="100" rx="4" fill="#fdf6e7" stroke="#b7791f"/>
  <text x="892" y="460" font-size="12" font-weight="700">V-World (국토교통부 국가공간정보 포털)</text>
  <text x="892" y="480">www · map · apis · 2d .vworld.kr</text>
  <text x="892" y="497">건물통합정보 · 토지이용 · 산봉우리 다운로드, 주소 검색, WMS</text>
  <text x="892" y="514">전송: V-World 계정 로그인, 검색어·좌표</text>
  <text x="892" y="531" fill="#6b7280">사전 다운로드 파일 등록으로 대체 가능</text>

  <!-- SRTM -->
  <rect x="880" y="556" width="310" height="70" rx="4" fill="#fdf6e7" stroke="#b7791f"/>
  <text x="892" y="576" font-size="12" font-weight="700">SRTM 지형고도 (AWS S3 공개 버킷)</text>
  <text x="892" y="596">s3.amazonaws.com/elevation-tiles-prod — 전송: 타일 좌표</text>
  <text x="892" y="613" fill="#6b7280">로컬 HGT 파일 등록으로 대체 가능</text>

  <!-- NOAA -->
  <rect x="880" y="642" width="310" height="70" rx="4" fill="#fdf6e7" stroke="#b7791f"/>
  <text x="892" y="662" font-size="12" font-weight="700">NOAA NGDC 지자기 편각 계산</text>
  <text x="892" y="682">www.ngdc.noaa.gov — 전송: 위경도·날짜</text>
  <text x="892" y="699" fill="#6b7280">실패 시 내장 WMM 오프라인 계산</text>

  <!-- 외부 브라우저 -->
  <line x1="820" y1="758" x2="880" y2="758" stroke="#3b4252" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="880" y="728" width="310" height="60" rx="4" fill="#ffffff" stroke="#8a94a6"/>
  <text x="892" y="748" font-size="12" font-weight="700">OS 기본 브라우저 — 안내 링크 열기</text>
  <text x="892" y="768">maps.google.com · earthdata.nasa.gov · vworld.kr</text>
  <text x="892" y="782" fill="#6b7280" font-size="10">사용자 클릭 시 앱 외부에서 열림 (opener)</text>

  <!-- 각주 -->
  <text x="40" y="940">※ 항적 자료(ASS 파일 내용)와 분석 결과는 외부로 전송되지 않으며 전량 로컬 data/ 폴더에만 저장됩니다. 외부 통신은 위 4개 공개 서비스에 대한 HTTPS 아웃바운드 요청으로 한정됩니다.</text>
  <text x="1210" y="940" text-anchor="end" fill="#6b7280" font-size="10">작성 2026-08-25 · package.json / tauri.conf.json / Cargo.toml 기준</text>
</svg>
